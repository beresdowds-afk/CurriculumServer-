apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: curriculum-server-frontend
  labels:
    cloud.googleapis.com/location: europe-west2
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: curriculum-server-runner@curriculum-server-prod.iam.gserviceaccount.com
      containers:
      - image: gcr.io/curriculum-server-prod/curriculum-server-frontend:latest
        ports:
        - containerPort: 8080
          name: http1
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 15
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8080"
