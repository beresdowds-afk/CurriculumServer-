<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Warm Orange-Amber Left Ribbon Gradient -->
    <linearGradient id="orangeRibbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="30%" stop-color="#F97316"/>
      <stop offset="70%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <!-- Deep Blue-Teal Center Twist Gradient -->
    <linearGradient id="centerTwistGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="80%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- Cyan to Emerald Right Ribbon Gradient -->
    <linearGradient id="cyanEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="35%" stop-color="#06B6D4"/>
      <stop offset="70%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Inner Shadow / Occlusion Gradient for 3D Overlap -->
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Ribbon Outer Glow Filter -->
    <filter id="ribbonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F97316" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1E293B" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Centered 3D Infinity Ribbon Mark -->
  <g transform="translate(56, 120) scale(0.667)" filter="url(#ribbonGlow)">
    <!-- Back Loop Layer (Left Bottom to Center Underpass) -->
    <path d="M 300 200 C 230 110 170 80 110 80 C 49 80 0 134 0 200 C 0 266 49 320 110 320 C 170 320 230 290 300 200 Z" 
          fill="url(#orangeRibbonGrad)" />

    <!-- Center Twist Crossing Depth -->
    <path d="M 300 200 C 370 110 430 80 490 80 C 551 80 600 134 600 200 C 600 266 551 320 490 320 C 430 320 370 290 300 200 Z" 
          fill="url(#cyanEmeraldGrad)" />

    <!-- Overlapping Ribbon Top Arch (Orange to Teal Flow) -->
    <path d="M 110 80 C 170 80 230 110 300 200 C 370 290 430 320 490 320 C 525 320 555 304 574 278 C 530 294 480 270 430 220 C 370 160 310 110 240 85 C 195 68 150 72 110 80 Z" 
          fill="url(#centerTwistGrad)" />

    <!-- Left Inner Loop Cutout / Ribbon Thickness -->
    <path d="M 110 135 C 145 135 185 155 235 200 C 185 245 145 265 110 265 C 74 265 45 236 45 200 C 45 164 74 135 110 135 Z" 
          fill="#0F172A" />

    <!-- Right Inner Loop Cutout / Ribbon Thickness -->
    <path d="M 490 135 C 526 135 555 164 555 200 C 555 236 526 265 490 265 C 455 265 415 245 365 200 C 415 155 455 135 490 135 Z" 
          fill="#0F172A" />

    <!-- 3D Bevel Ribbon Highlights -->
    <path d="M 110 80 C 49 80 0 134 0 200 C 0 206 1 212 2 218 C 8 160 54 115 110 115 C 165 115 215 145 275 210 L 290 195 C 230 115 170 80 110 80 Z" 
          fill="#FFFFFF" 
          opacity="0.25" />

    <path d="M 490 80 C 551 80 600 134 600 200 C 600 206 599 212 598 218 C 592 160 546 115 490 115 C 435 115 385 145 325 210 L 310 195 C 370 115 430 80 490 80 Z" 
          fill="#FFFFFF" 
          opacity="0.2" />

    <!-- Inner Core Shadows for Dimensionality -->
    <path d="M 235 200 C 265 235 300 270 340 290 C 315 275 285 245 260 215 Z" 
          fill="#000000" 
          opacity="0.4" />
  </g>
</svg>
