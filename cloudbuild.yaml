# Cloud Build Configuration for Curriculum Server
# Project: curious-subject-477114-e4
# Region: europe-west1

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-curriculum-server-image'
    args:
      - 'build'
      - '-f'
      - 'apps/curriculum-server/Dockerfile'
      - '-t'
      - 'europe-west1-docker.pkg.dev/curious-subject-477114-e4/curriculum-registry/curriculum-server:$COMMIT_SHA'
      - '-t'
      - 'europe-west1-docker.pkg.dev/curious-subject-477114-e4/curriculum-registry/curriculum-server:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-curriculum-server-image'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/curious-subject-477114-e4/curriculum-registry/curriculum-server:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-curriculum-server'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'curriculum-server'
      - '--image'
      - 'europe-west1-docker.pkg.dev/curious-subject-477114-e4/curriculum-registry/curriculum-server:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--project'
      - 'curious-subject-477114-e4'
      - '--platform'
      - 'managed'
