
name: Deploy Curriculum Server

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: curious-subject-477114-e4
  REGION: europe-west1
  SERVICE_NAME: curriculum-server
  IMAGE_URI: europe-west1-docker.pkg.dev/curious-subject-477114-e4/curriculum-registry/curriculum-server
  WIF_PROVIDER: projects/797788066041/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  CI_SERVICE_ACCOUNT: curriculum-ci-deployer@curious-subject-477114-e4.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build and deploy Curriculum Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Build application
        run: npm run build:server

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker authentication
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/curriculum-server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_URI }}:${{ github.sha }}
            ${{ env.IMAGE_URI }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_URI }}:${{ github.sha }}
          region: ${{ env.REGION }}

      - name: Verify deployment health
        run: |
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')

          echo "Checking $SERVICE_URL/healthz"
          curl --fail --show-error --retry 5 --retry-delay 5 \
            "$SERVICE_URL/healthz"
