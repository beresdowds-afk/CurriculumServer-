
name: Deploy Curriculum Server

on:
  push:
    branches:
      - main
    paths:
      # Curriculum Server-specific source and configuration
      - 'apps/curriculum-server/**'
      - 'vite.server.config.ts'

      # Shared application dependencies
      - 'src/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tailwind.config.*'
      - 'postcss.config.*'

      # Shared build and deployment configuration
      - 'apps/curriculum-server/Dockerfile'
      - '.github/workflows/deploy-curriculum-server.yml'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: curious-subject-477114-e4
  REGION: europe-west1
  SERVICE_NAME: curriculum-server
  IMAGE_URI: europe-west1-docker.pkg.dev/curious-subject-477114-e4/curriculum-registry/curriculum-server
  WIF_PROVIDER: projects/797788066041/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  CI_SERVICE_ACCOUNT: curriculum-ci-deployer@curious-subject-477114-e4.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build and deploy Curriculum Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Build application
        run: npm run build:server

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

            - name: Verify deployed Curriculum Server application
        shell: bash
        run: |
          set -euo pipefail

          SERVICE_URL="$(gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')"

          echo "Checking Cloud Run service: $SERVICE_URL"

          curl --fail --show-error --silent \
            --retry 5 --retry-delay 5 \
            "$SERVICE_URL/healthz"

          curl --fail --show-error --silent \
            --retry 5 --retry-delay 5 \
            "$SERVICE_URL/" \
            -o /tmp/curriculum-server-index.html

          if ! grep -qi '<title>Curriculum Server' \
            /tmp/curriculum-server-index.html; then
            echo "ERROR: Cloud Run is not serving the Curriculum Server HTML entry."
            cat /tmp/curriculum-server-index.html
            exit 1
          fi

          if ! grep -Eq 'src="[^"]+\.js' \
            /tmp/curriculum-server-index.html; then
            echo "ERROR: Curriculum Server JavaScript bundle reference is missing."
            exit 1
          fi

          echo "PASS: Cloud Run serves the Curriculum Server application."

      - name: Verify Curriculum Server public domains
        shell: bash
        run: |
          set -euo pipefail

          for DOMAIN in \
            curriculumserver.com.ng \
            www.curriculumserver.com.ng
          do
            echo "Checking https://$DOMAIN/"

            curl --fail --show-error --silent \
              --retry 5 --retry-delay 10 \
              "https://$DOMAIN/" \
              -o "/tmp/${DOMAIN}.html"

            if ! grep -qi '<title>Curriculum Server' \
              "/tmp/${DOMAIN}.html"; then
              echo "ERROR: $DOMAIN does not serve Curriculum Server."
              exit 1
            fi

            echo "PASS: $DOMAIN serves Curriculum Server."
          done

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_URI }}:${{ github.sha }}
          region: ${{ env.REGION }}

      - name: Verify deployment health
        run: |
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')

          echo "Checking $SERVICE_URL/healthz"
          curl --fail --show-error --retry 5 --retry-delay 5 \
            "$SERVICE_URL/healthz"
